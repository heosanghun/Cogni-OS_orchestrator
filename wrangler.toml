name = "cogni-os-orchestrator"
compatibility_date = "2026-07-30"
pages_build_output_dir = "./public"

[vars]
ENVIRONMENT = "production"
SYSTEM_NAME = "Cogni-OS Orchestrator"
COGNI_WORKSPACE_ID = "5988e0651ec1afcdeb87b58ccc8d68ea"
MAX_SNAPSHOT_AGE_SECONDS = "180"
MAX_CLOCK_SKEW_SECONDS = "300"

# Production requires a D1 binding named MONITOR_DB and an encrypted JSON
# keyring secret named INGEST_HMAC_KEYS. Store one to four key-id/secret pairs,
# for example {"publisher-2026q3":"<32-256-char-random-secret>"}, with
# `wrangler pages secret put INGEST_HMAC_KEYS`; never commit the real value.
# This ID is the actual account resource created for the evidence dashboard.
[[d1_databases]]
binding = "MONITOR_DB"
database_name = "cogni-os-monitoring"
database_id = "2cd7f106-b05f-46ec-b9d1-2b9f40b2edd1"
