name: Monitoring production recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Recover the Cloudflare platform or verify trusted live data
        required: true
        default: recover-platform
        type: choice
        options:
          - recover-platform
          - verify-live

permissions:
  contents: read

concurrency:
  group: monitoring-production-recovery
  cancel-in-progress: false

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fail-closed main-branch preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Install the integrity-locked toolchain without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Source and migration trust gates
        run: |
          npm run check
          npm test
          node scripts/validate_p01_node.mjs
          python -I scripts/validate_monitoring_migrations.py

  recover-platform:
    if: ${{ inputs.mode == 'recover-platform' }}
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the integrity-locked toolchain without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply ordered D1 migrations to production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ./node_modules/.bin/wrangler d1 migrations list cogni-os-monitoring --remote
          ./node_modules/.bin/wrangler d1 migrations apply cogni-os-monitoring --remote
      - name: Trigger the protected main-branch Pages build
        shell: bash
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          case "$CLOUDFLARE_PAGES_DEPLOY_HOOK" in
            https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/*) ;;
            *) echo "The protected Pages deploy hook has an invalid origin." >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error \
            --request POST \
            --output /dev/null \
            "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
      - name: Require exact commit-bound configured production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node scripts/probe_monitoring_production.mjs \
              --expected-commit "$GITHUB_SHA" \
              --mode configured \
              > production-probe.json 2> production-probe.err; then
              cat production-probe.json
              exit 0
            fi
            sleep 10
          done
          cat production-probe.json || true
          cat production-probe.err >&2 || true
          exit 1

  verify-live:
    if: ${{ inputs.mode == 'verify-live' }}
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require signed fresh data and API deployment evidence
        run: >-
          node scripts/probe_monitoring_production.mjs
          --expected-commit "$GITHUB_SHA"
          --mode live
